  // ---------- Ansichten ----------

      for (var k = 0; k < c.teile.length; k++) {
        var t = c.teile[k];
        wege.push(t.fuss ? '<span class="small">zu Fuss ' + t.fuss + "'</span>" :
          '<span class="linie ' + t.typ + '" style="margin-right:.2rem">' + esc(t.linie) + '</span><span class="small">' + hm(t.ab) + " " + esc(t.von) +
          (t.gleis ? " (" + (t.typ === "zug" ? "Gl. " : "") + esc(t.gleis) + ")" : "") + "</span>");
      }
      items.push({ html: '<div class="it"><div class="row"><div class="grow"><span class="pill">ab ' + esc(c.start || "") + "</span> " + '<b style="font-size:1.05rem">' + hm(c.plan) + (c.delay ? " +" + c.delay + "'" : "") + " → " + hm(c.an) + "</b>" + '<div class="small muted">' + (c.dauer ? c.dauer + " Min." : "") +
        " · " + (c.umsteigen ? c.umsteigen + "× umsteigen" : "direkt") + '</div></div><div class="min">' + (min === 0 ? "los!" : min + "'") + "</div></div>" +
        '<div class="weg">' + wege.join(' <span class="small">›</span> ') + "</div></div>" });
    }
    var namen = [];
    for (var z = 0; R && R.starts && z < R.starts.length; z++) namen.push(R.starts[z].name.replace(/^Zürich,\s*/, ""));
    var titel = '<div class="small" style="margin-bottom:.2rem">Nach <b>' + esc(R ? R.nach : "") + "</b> ab " + esc(namen.join(", ")) + (R && R.starts && R.starts[0].fuss ? " · Minuten = wann du los musst" : "") + "</div>";
    if (!items.length) return kopf + titel + '<div class="leer">Keine Verbindungen mehr in den Daten.<br>Neue kommen mit der nächsten Aktualisierung.</div>';
    return liste("oev", items, null, kopf + titel);
  }

  function ansichtOev() {
    if (oevModus === "route") return ansichtRoute();
    var quelle = liveOev && Date.now() - liveOev.stand < 10 * 60000 ? liveOev : (D.oev ? { stand: D.stand, abfahrten: D.oev.abfahrten } : null);
    if (!quelle) return oevUmschalter("") + '<div class="leer">Keine Abfahrtsdaten.</div>';
    var now = Date.now(), items = [];
    for (var i = 0; i < quelle.abfahrten.length; i++) {
      var a = quelle.abfahrten[i], min = Math.floor((a.ab - now) / 60000);
      if (min < 0) continue;
      items.push({ html: '<div class="it row"><span class="linie ' + a.typ + '">' + esc(a.linie) + '</span><div class="grow"><div class="tt ell"><b>' + esc(a.ziel) +
        '</b></div><div class="small muted ell">' + hm(a.plan) + (a.delay ? ' <b>+' + a.delay + "'</b>" : "") + (a.gleis ? " · " + (a.typ === "zug" ? "Gleis " : "Kante ") + esc(a.gleis) : "") +
        '</div></div><div class="min">' + (min === 0 ? "jetzt" : min + "'") + "</div></div>" });
    }
    var kopf = oevUmschalter((quelle === liveOev ? "live · " : "Fahrplan · Stand ") + hm(quelle.stand));
    if (!items.length) return kopf + '<div class="leer">Keine Abfahrten mehr in den Daten.<br>Neue kommen mit der nächsten Aktualisierung.</div>';
    return liste("oev", items, null, kopf);
  }

  function ansichtNews() {
    var N = D.news;
    if (!N || !N.length) return '<div class="leer">Keine News.</div>';
    var items = [];
    for (var i = 0; i < N.length; i++) {
      var n = N[i], neu = n.ts && Date.now() / 1000 - n.ts < 3600;
      items.push({ html: '<div class="it"><div class="zeit">' + (n.ts ? hm(n.ts * 1000) : "") + (neu ? '<span class="neu">NEU</span>' : "") +
        '</div><div class="titel">' + esc(n.title) + "</div>" + (n.lead ? '<div class="lead">' + esc(n.lead.length > 220 ? n.lead.slice(0, 217) + "…" : n.lead) + "</div>" : "") + "</div>" });
    }
    return liste("news", items, null, '<div class="row between" style="margin-bottom:.2rem"><b>News des Tages</b><span class="small">SRF</span></div>');
  }

  // ---------- Sport ----------
  function sportKopf(rechts) {
    return '<div class="row between" style="margin-bottom:.4rem"><div class="row">' +
      '<span class="pill' + (sportModus === "f1" ? " blk" : "") + ' knopf" data-sport="f1">Formel 1</span>' +
      '<span class="pill' + (sportModus === "bayern" ? " blk" : "") + ' knopf" data-sport="bayern">FC Bayern</span></div><span class="small">' + rechts + "</span></div>";
  }
  function ansichtSport() {
    var S = D.sport || {};
    return sportModus === "bayern" ? ansichtBayern(S.bayern) : ansichtF1(S.f1);
  }
  function ansichtF1(F) {
    if (!F) return sportKopf("") + '<div class="leer">Noch keine Formel-1-Daten.<br>Sie kommen mit der nächsten Aktualisierung.</div>';
    var kopf = sportKopf("Saison " + esc(F.saison || "") + (F.ts ? " · Stand " + hm(F.ts) : ""));
    var N = F.naechstes, L = F.letztes, links = "", rechts = "";
    if (N) {
      var form = N.strecke_form && N.strecke_form.pfad ? '<svg class="strecke" viewBox="' + esc(N.strecke_form.vb) + '"><path d="' + esc(N.strecke_form.pfad) +
        '" fill="none" stroke="#000" stroke-width="6" stroke-linejoin="round"/>' +
        (N.strecke_form.start_x != null ? '<circle cx="' + N.strecke_form.start_x + '" cy="' + N.strecke_form.start_y + '" r="9" fill="#000"/>' : "") + "</svg>" : "";
      var ses = "";
      for (var i = 0; i < (N.sessions || []).length; i++) {
        var x = N.sessions[i];
        ses += '<div class="row ses' + (x.vorbei ? " vorbei" : "") + (x.name === "Rennen" ? " rennen" : "") + '"><span class="grow">' + esc(x.name) + "</span><span>" + esc(x.zeit) + "</span></div>";
      }
      links = '<div class="h" style="margin-top:0">Nächster Grand Prix · Runde ' + esc(N.runde) + "</div>" +
        '<div class="row"><div class="grow"><div class="gp">' + esc(N.name) + '</div><div class="small">' + esc(N.ort) + " · " + esc(N.strecke) + "</div>" +
        '<div style="margin-top:.3rem"><b>' + esc(N.datum) + (N.start ? " · " + esc(N.start) : "") + '</b> <span class="pill blk">' + esc(N.countdown) + "</span>" +
        (N.sprint ? ' <span class="pill">Sprint</span>' : "") + "</div></div>" + form + "</div>" +
        '<div class="sessions">' + ses + "</div>";
    } else links = '<div class="h" style="margin-top:0">Nächster Grand Prix</div><div class="leer" style="margin-top:.5rem">Saisonpause</div>';
    if (L && L.podium && L.podium.length) {
      rechts += '<div class="h" style="margin-top:0">Letztes Rennen · ' + esc(L.name) + "</div>";
      for (var p = 0; p < L.podium.length; p++) rechts += '<div class="row tab-z"><span class="pos">' + esc(L.podium[p].pos) + '.</span><b class="grow">' + esc(L.podium[p].fahrer) + '</b><span class="small">' + esc(L.podium[p].team) + "</span></div>";
    }
    if (F.fahrer && F.fahrer.length) {
      rechts += '<div class="h">Fahrer-WM</div>';
      var n = quer() ? 7 : 6;
      for (var f = 0; f < F.fahrer.length && f < n; f++) {
        var d = F.fahrer[f];
        rechts += '<div class="row tab-z"><span class="pos">' + esc(d.pos) + '.</span><span class="grow"><b>' + esc(d.fahrer) + '</b> <span class="small muted">' + esc(d.team) + '</span></span><b>' + esc(d.punkte) + "</b></div>";
      }
    }
    return kopf + (quer() ? '<div class="row spalten"><div class="sp">' + links + '</div><div class="sp">' + rechts + "</div></div>" : links + '<div style="height:.6rem"></div>' + rechts);
  }
  var RES_TXT = { S: "Sieg", U: "Remis", N: "Niederlage" };
  function spielZeile(n) {
    if (!n) return '<div class="small muted">kein Spiel angesetzt</div>';
    return '<div class="spiel"><b>' + esc(n.heim) + " – " + esc(n.gast) + "</b>" + (n.live ? ' <span class="pill blk">LIVE ' + esc(n.stand) + "</span>" : "") +
      '<div class="small">' + esc(n.datum) + " · " + esc(n.zeit) + (n.runde ? " · " + esc(n.runde) : "") + "</div></div>";
  }
  function ansichtBayern(B) {
    if (!B) return sportKopf("") + '<div class="leer">Noch keine FC-Bayern-Daten.<br>Dafür braucht es das Secret FOOTBALL_DATA_TOKEN.</div>';
    var form = "";
    for (var i = 0; i < (B.form || []).length; i++) form += '<span class="form' + (B.form[i] === "S" ? " blk" : "") + '">' + esc(B.form[i]) + "</span>";
    var kopf = sportKopf((form ? '<span class="small" style="margin-right:.3rem">Form</span>' + form + " · " : "") + (B.ts ? "Stand " + hm(B.ts) : ""));
    var BL = B.bl || {}, CL = B.cl || {}, links = "", rechts = "";
    links += '<div class="h" style="margin-top:0">Bundesliga' + (BL.platz ? " · Platz " + BL.platz + " · " + BL.pkt + " Pkt." : "") + "</div>";
    links += '<div class="small"><b>Nächstes Spiel</b></div>' + spielZeile(BL.n);
    if (BL.l) {
      var l = BL.l;
      links += '<div class="small" style="margin-top:.35rem"><b>Letztes Spiel</b></div><div class="spiel"><span class="pill' + (l.res === "S" ? " blk" : "") + '">' + esc(RES_TXT[l.res] || l.res) + "</span> <b>" +
        esc(l.ergebnis) + "</b> " + esc(l.ort) + " " + esc(l.gegner) + '<div class="small">' + esc(l.datum) + (l.runde ? " · " + esc(l.runde) : "") + "</div>" +
        (l.scorer ? '<div class="small">⚽ ' + esc(l.scorer) + "</div>" : "") + (l.siegtor ? '<div class="small">Siegtor: ' + esc(l.siegtor) + "</div>" : "") + "</div>";
    }
    if (BL.tab && BL.tab.length) {
      links += '<div class="h">Tabelle</div>';
      for (var t = 0; t < BL.tab.length; t++) {
        var z = BL.tab[t], ich = z.p === BL.platz;
        links += '<div class="row tab-z' + (ich ? " ich" : "") + '"><span class="pos">' + z.p + '.</span><span class="grow ell">' + esc(z.t) + '</span><span class="small" style="width:2.4rem;text-align:right">' + esc(z.d) + '</span><b style="width:2.2rem;text-align:right">' + z.k + "</b></div>";
      }
    }
    if (B.top && B.top.length) {
      rechts += '<div class="h" style="margin-top:0">Topskorer Bundesliga</div>';
      for (var k = 0; k < B.top.length; k++) {
        var s = B.top[k];
        rechts += '<div class="row tab-z"><span class="pos">' + (s.nr != null ? s.nr : "") + '</span><b class="grow">' + esc(s.n) + '</b><span class="small">' + s.t + " Tore · " + s.v + " Vorl. · " + s.sp + " Sp.</span></div>";
      }
    }
    rechts += '<div class="h">Champions League' + (CL.platz ? " · Platz " + CL.platz + " · " + CL.pkt + " Pkt." : "") + "</div>";
    rechts += '<div class="small"><b>Nächstes Spiel</b></div>' + spielZeile(CL.n);
    if (CL.l) rechts += '<div class="small" style="margin-top:.35rem"><b>Letztes Spiel</b></div><div class="spiel"><b>' + esc(CL.l.ergebnis) + "</b> " + esc(CL.l.ort) + " " + esc(CL.l.gegner) +
      ' <span class="small">(' + esc(CL.l.datum) + ")</span></div>";
    return kopf + (quer() ? '<div class="row spalten"><div class="sp">' + links + '</div><div class="sp">' + rechts + "</div></div>" : links + '<div style="height:.6rem"></div>' + rechts);
  }

  // ---------- Adventskalender ----------
  // Hinter jedem Türchen eine alte, gemeinfreie Weihnachtspostkarte (Bilder liegen in advent/01.jpg …, siehe build/advent.json)
  var BILDER = [
    ["Rotkehlchen", "1906", 0.6419],
    ["Häuschen im Schnee", "", 0.6441],
    ["Winterspass im Schnee", "um 1890", 1.583],
    ["Winterwald", "1913", 1.6832],
    ["Schneeballschlacht vor der Kirche", "um 1911", 0.6385],
    ["Samichlaus mit Rentieren", "1907", 0.6488],
    ["Wichtel an der Haustür", "", 0.6398],
    ["Stechpalme", "um 1900", 0.5664],
    ["Mädchen mit Korb", "1917", 1.5477],
    ["Sternsinger im Dorf", "1916", 1.3333],
    ["Rehe am Waldrand", "1908", 0.6312],
    ["Kirchlein im Schnee", "", 0.6401],
    ["Samichlaus im Luftschiff", "um 1916", 1.5667],
    ["Glocken", "1905", 1.6466],
    ["Haus am Bach", "", 0.641],
    ["Kinder mit Geschenken", "um 1909", 0.6279],
    ["Schlittenfahrt mit Wichteln", "", 1.5284],
    ["Dorf im Schnee mit Kerzen", "1905", 0.7991],
    ["Mädchen mit Kätzchen", "", 0.649],
    ["Postkutsche im Schnee", "1911", 0.6312],
    ["Mädchen im Schnee", "um 1907", 0.653],
    ["Tannenzweig über dem Dorf", "1905", 1.634],
    ["Mondnacht im Winterwald", "1911", 0.6425],
    ["Der Weihnachtsbaum", "1906", 0.6406]
  ];
  // Türchen-Anordnung auf dem Raster (fix, damit man jeden Tag suchen darf)
  var TUER_ORDNUNG = [17, 3, 22, 9, 14, 1, 6, 20, 11, 24, 4, 15, 19, 8, 2, 13, 23, 10, 5, 18, 12, 21, 7, 16];
  function adventHeute() { var d = heute(); return d.getMonth() === 11 ? Math.min(24, d.getDate()) : 0; }
  function kranz(n) { // Adventskranz mit n brennenden Kerzen
    var g = '<svg class="kranz" viewBox="0 0 220 120"><g ' + S + ">";
    g += '<ellipse cx="110" cy="96" rx="100" ry="18"/><path d="M18 92c8-6 14-2 20-7M44 106c6-7 13-4 18-9M80 112c5-7 12-5 16-11M120 112c4-7 12-6 16-11M158 106c4-7 12-6 17-10M188 96c3-6 10-6 14-10M30 84c4 4 10 3 14 8M70 80c4 5 10 4 14 9M150 80c4 5 10 4 14 9M182 84c4 4 9 4 12 8"/>';
    var xs = [42, 86, 134, 178];
    for (var i = 0; i < 4; i++) {
      var x = xs[i];
      g += '<rect x="' + (x - 9) + '" y="44" width="18" height="44" rx="2"' + (i < n ? "" : ' stroke-dasharray="4 3"') + "/>";
      g += '<path d="M' + x + ' 44v-6"/>';
      if (i < n) g += '<path d="M' + x + " 16c-8 10-8 16 0 21 8-5 8-11 0-21z" + '" fill="#000"/>';
    }
    return g + "</g></svg>";
  }
  function ansichtAdvent() {
    var tag = adventHeute(), kerzen = kerzenZahl(), wahl = adventWahl && adventWahl <= tag ? adventWahl : tag;
    var so = adventSonntage(heute().getFullYear()), sonntagHeute = 0;
    for (var k = 0; k < 4; k++) if (tagNull(so[k]) === tagNull(heute())) sonntagHeute = k + 1;
    var kranzBox = '<div class="kranzbox">' + kranz(kerzen) + '<div class="small"><b>' +
      (sonntagHeute ? "Heute ist der " + sonntagHeute + ". Advent" : kerzen ? kerzen + (kerzen === 1 ? " Kerze brennt" : " Kerzen brennen") : "") + "</b></div></div>";
    var inhalt;
    if (!tag) {
      inhalt = '<div class="tuerinhalt"><div class="small"><b>Bald geht es los</b></div><div class="tuertext">Ab dem 1. Dezember öffnet sich hier jeden Tag ein Türchen.</div></div>';
    } else {
      var e = BILDER[wahl - 1] || ["", "", 0.65];
      // Grösse aus dem Seitenverhältnis berechnen, damit nichts springt, während das Bild lädt
      var maxH = quer() ? 20 : 17, maxW = quer() ? 20 : 18, bh = maxH, bw = bh * e[2];
      if (bw > maxW) { bw = maxW; bh = bw / e[2]; }
      inhalt = '<div class="tuerinhalt bildbox"><div class="small"><b>' + (wahl === tag ? "Heute, " : "") + wahl + ". Dezember</b> · " + esc(e[0]) + "</div>" +
        '<img class="karte" src="advent/' + (wahl < 10 ? "0" : "") + wahl + '.jpg" alt="" style="width:' + bw.toFixed(2) + "rem;height:" + bh.toFixed(2) + 'rem">' +
        (e[1] ? '<div class="small muted">Postkarte ' + esc(e[1]) + "</div>" : "") + "</div>";
    }
    var raster = '<div class="raster">';
    for (var i = 0; i < TUER_ORDNUNG.length; i++) {
      var n = TUER_ORDNUNG[i], auf = n <= tag;
      raster += '<div class="tuer' + (n < tag ? " offen" : "") + (n === tag ? " heute" : "") + (auf && n === wahl ? " gewaehlt" : "") + (auf ? "" : " zu") + '" data-tuer="' + n + '">' + n + "</div>";
    }
    raster += "</div>";
    var rest = Math.round((tagNull(new Date(heute().getFullYear(), 11, 24)) - tagNull(heute())) / 86400000);
    var titel = '<div class="row between" style="margin-bottom:.3rem"><b>Adventskalender</b><span class="small">' +
      (rest > 0 ? "noch " + rest + (rest === 1 ? " Tag" : " Tage") + " bis Weihnachten" : "Frohe Weihnachten!") + "</span></div>";
    return quer() ? titel + '<div class="row spalten"><div class="sp">' + inhalt + '</div><div class="sp">' + raster + kranzBox + "</div></div>"
      : titel + '<div class="row" style="-webkit-box-align:start;-webkit-align-items:flex-start;align-items:flex-start"><div style="width:38%;margin-right:.6rem">' + kranzBox + '</div><div class="grow">' + inhalt + "</div></div>" + raster;
  }

  function zeichnen(erzwingen) {
    var view = $("view"), html;
    gemessen = false;
    var fuellen = tab === "heute" || tab === "sport" || tab === "advent"; // Ansichten ohne Blättern füllen den Bildschirm
    if (!fuellen) document.documentElement.style.fontSize = basisPx + "px";
    if (!D) {
      html = schluessel() ? '<div class="leer">Lade Daten …' + (ladeFehler ? "<br><br>Fehler: " + esc(ladeFehler) : "") + "</div>" :
        '<div class="leer">Schlüssel fürs Dashboard eingeben:<br><input id="keyin" type="text" autocapitalize="off" autocorrect="off"><br><span class="btn" id="keyok">OK</span></div>';
    } else {
      try {
        html = tab === "heute" ? ansichtHeute() : tab === "termine" ? ansichtTermine() : tab === "oev" ? ansichtOev() :
          tab === "sport" ? ansichtSport() : tab === "advent" ? ansichtAdvent() : ansichtNews();
      } catch (e) { html = '<div class="leer">Anzeigefehler: ' + esc(e.message) + "</div>"; }
    }
    // Fusszeile zuerst, damit «Heute» danach mit der richtigen Höhe misst
    var alt = D && D.stand ? Math.round((Date.now() - D.stand) / 60000) : 0;
    $("stand").innerHTML = D && D.stand ? "Stand " + hm(D.stand) + (alt > 45 ? " <b>Daten " + alt + " Min. alt</b>" : "") : "";
    var st = [];
    if (ladeFehler) st.push("<b>offline</b>");
    if (D && D.aelter && D.aelter.length) st.push("älterer Stand: " + esc(D.aelter.join(", ")));
    else if (D && D.fehler && D.fehler.length) st.push(D.fehler.length + " Quelle(n) gestört");
    if (D && D.quellen) st.push("Wetter: " + esc(D.quellen));
    $("status").innerHTML = st.join(" · ");
    // E-Ink: nur neu zeichnen, wenn sich etwas geändert hat
    // liste() misst direkt im Bildschirm, danach muss das Ergebnis in jedem Fall gesetzt werden
    if (erzwingen || gemessen || html !== letztesHtml) {
      view.innerHTML = html; letztesHtml = html;
      if (fuellen && D) passen();
    }

  }

  // ---------- Start ----------
  // Schriftgrösse an die Bildschirmbreite anpassen (Tolino Shine 3 ≈ 536 CSS-Pixel breit)
  // Hoch- oder Querformat (in Fully einstellbar); Schrift richtet sich nach der kürzeren Seite
  function quer() { return (window.innerWidth || 0) > (window.innerHeight || 0); }
  var basisPx = 16;
  // Tabs links (Standard) oder unten: einmal mit #…&nav=unten bzw. &nav=seite aufrufen, wird gemerkt
  function navUnten() {
    var m = /[#&]nav=(unten|seite)/.exec(location.hash || "");
    if (m) { try { localStorage.setItem("dashboard_nav", m[1]); } catch (e) {} return m[1] === "unten"; }
    try { return localStorage.getItem("dashboard_nav") === "unten"; } catch (e) { return false; }
  }
  function skalieren() {
    var w = window.innerWidth || 536, hh = window.innerHeight || 724;
    basisPx = Math.max(12, Math.min(26, Math.min(w, hh) / 34));
    document.documentElement.style.fontSize = basisPx + "px";
    document.body.className = (quer() ? "quer" : "") + (navUnten() ? " unten" : "");
  }
  // «Heute», «Sport» und «Advent» füllen den Bildschirm: Schrift in kleinen Schritten vergrössern, bis der Platz ausgeht (max. +60 %)
  function inhaltHoehe(v) { // scrollHeight ist nie kleiner als die Box, darum die Kinder ausmessen
    var max = 0, top = v.getBoundingClientRect().top;
    for (var i = 0; i < v.children.length; i++) {
      var r = v.children[i].getBoundingClientRect();
      if (r.bottom - top > max) max = r.bottom - top;
    }
    return max;
  }
  function zuBreit(v) {
    if (v.scrollWidth > v.clientWidth + 1) return true;
    var sp = v.querySelectorAll(".sp, .wetter");
    for (var i = 0; i < sp.length; i++) if (sp[i].scrollWidth > sp[i].clientWidth + 1) return true;
    return false;
  }
  function passen() {
    var root = document.documentElement, v = $("view"), px = basisPx;
    root.style.fontSize = px + "px";
    while (px < basisPx * 1.6) {
      root.style.fontSize = (px + 0.5) + "px";
      // zu hoch, oder eine Zeile wird zu breit (Wettertext bricht nicht um, sondern ragt raus)
      if (inhaltHoehe(v) > v.clientHeight - 6 || zuBreit(v)) { root.style.fontSize = px + "px"; break; }
      px += 0.5;
    }
  }
  skalieren();
  window.addEventListener("resize", function () { skalieren(); zeichnen(true); });
  window.addEventListener("hashchange", laden);
  navZeichnen();
  laden();

  setInterval(laden, REFRESH_DATEN);
  setInterval(function () { if (D) zeichnen(false); }, 30000); // Uhr, Countdown, ÖV-Minuten
  setInterval(function () { if (tab === "oev") oevLiveHolen(); }, 60000);
  window.__dashboard = { zeichnen: zeichnen, setDaten: function (d) { D = d; zeichnen(true); },
    setDatum: function (iso) { testDatum = iso ? new Date(iso) : null; navZeichnen(); zeichnen(true); } }; // für Tests
})();
