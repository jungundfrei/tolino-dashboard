name: Tolino-Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub startet oft ein paar Minuten später)
  workflow_dispatch:          # «Run workflow» von Hand
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Netatmo-Tokens vom letzten Lauf zurückholen (Netatmo tauscht sie bei jeder Erneuerung aus)
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sport aus den bestehenden TRMNL-Skripten (Kopien in sport/), nur alle 1–2 Std., um die APIs zu schonen
      - name: Sport holen
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          mkdir -p state
          faellig() { [ ! -f "state/$1.ts" ] || [ $(( $(date +%s) - $(cat "state/$1.ts") )) -ge "$2" ]; }
          if faellig f1 6600; then
            python3 sport/f1_fetch.py --dry-run > state/f1.neu && mv state/f1.neu state/f1.json && date +%s > state/f1.ts || echo "F1: nicht erreichbar"
          fi
          if [ -n "$FOOTBALL_DATA_TOKEN" ] && faellig bayern 3300; then
            pip install -q requests && python3 sport/fetch_bayern.py --dry-run > state/bayern.neu && mv state/bayern.neu state/bayern.json && date +%s > state/bayern.ts || echo "Bayern: nicht erreichbar"
          fi

      - name: Daten holen
        run: node build/build.js
        env:
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
          KALENDER_1: ${{ secrets.KALENDER_1 }}
          KALENDER_2: ${{ secrets.KALENDER_2 }}
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          PLZ: ${{ vars.PLZ }}
          ORT: ${{ vars.ORT }}
          NEWS_FEED: ${{ vars.NEWS_FEED }}
          OEV_STATIONEN: ${{ vars.OEV_STATIONEN }}
          ROUTE_VON: ${{ vars.ROUTE_VON }}
          ROUTE_NACH: ${{ vars.ROUTE_NACH }}

      # Adventskalender: alte Postkarten einmalig von Wikimedia holen (danach aus dem Cache)
      - name: Adventsbilder
        run: |
          pip install -q pillow && python3 build/advent_bilder.py || echo "Adventsbilder - Problem, siehe oben"

      - uses: actions/cache/save@v4
        if: always() && hashFiles('state/state.json') != ''
        with:
          path: state
          key: state-${{ github.run_id }}

      # Auf den eigenen Webspace (cyon) hochladen – mit SSH-Schlüssel (SFTP_KEY) oder Passwort (SFTP_PASSWORD)
      - name: Hochladen per SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_PFAD: ${{ secrets.SFTP_PFAD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          if [ -n "$SFTP_KEY" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$SFTP_KEY" > ~/.ssh/tolino_key && chmod 600 ~/.ssh/tolino_key
            VERBINDUNG="set sftp:connect-program 'ssh -a -x -i $HOME/.ssh/tolino_key -o StrictHostKeyChecking=accept-new';"
            LOGIN="$SFTP_USER,"
          else
            VERBINDUNG=""
            LOGIN="$SFTP_USER,$SFTP_PASSWORD"
          fi
          lftp -u "$LOGIN" "sftp://$SFTP_HOST" -e "
            $VERBINDUNG set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20;
            mkdir -p -f $SFTP_PFAD; cd $SFTP_PFAD;
            mirror -R --no-perms --verbose=0 --exclude advent/ _site . ;
            mirror -R --no-perms --verbose=0 --ignore-time _site/advent advent ;
            bye"
